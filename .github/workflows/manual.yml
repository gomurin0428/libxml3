name: Manual verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned toolchain
        run: ./eng/bootstrap.sh
      - name: Build and test
        run: |
          make reference
          make check-inventory
          make build
          make test-api
          make test-errors test-oom test-fuzz test-resources test-encoding test-dom test-attributes test-namespace-edit test-serialization test-copy test-sanitize
          make compare
          make compare-system
          make check
          make test-development
      - name: Prove core
        id: prove
        run: make prove
      - name: Upload proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-reports
          path: |
            obj/proof/gnatprove/
            docs/proof-report.md
            docs/proof-summary.txt
